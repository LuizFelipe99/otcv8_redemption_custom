<link href="template/css/craftbench_main.css" />

<html>
<window id="craftBenchWindow" class="cbWindow" placement="center"
    title="Craft Bench" onescape="self:hide()">

    <div class="cbMainArea">

        <div class="cbRecipeList">

            <TextEdit class="cbSearchInput"
                placeholder="Search recipe..."
                onTextChange="self:onSearchChange(text)">
            </TextEdit>

            <div class="cbRecipeRows" vertical-scrollbar="recipeListScrollBar">
                <div *for="local recipe in self.filteredRecipes"
                    class="cbRecipeRow"
                    onclick="self:selectRecipe(recipe.index)">

                    <div class="cbRecipeRowHighlight" *visible="self.selectedRecipeIndex == recipe.index"></div>

                    <UIItem class="cbRecipeResultIcon"
                        *visible="recipe.resultClientId and recipe.resultClientId > 0"
                        *item-id="recipe.resultClientId or 1"
                        *border-color="self:getRarityColor(recipe.resultRarity)"
                        virtual="true"></UIItem>

                    <div class="cbRecipeResultInfo">
                        <label class="cbRecipeResultName">{{recipe.resultName}}</label>
                    </div>

                </div>
            </div>

            <VerticalScrollBar id="recipeListScrollBar"
                class="cbRecipeListScrollBar"
                step="48"
                pixels-scroll="true">
            </VerticalScrollBar>

        </div>

        <div class="cbSidePanel">

            <div class="cbIngredientsBox" title="Ingredients">

                <div class="cbIngSlot" *visible="self.firstIngVisible">
                    <UIItem class="cbIngIcon" *item-id="self.firstIngClientId" virtual="true"></UIItem>
                    <div class="cbIngInfo">
                        <label class="cbIngName">{{self.firstIngName}}</label>
                        <label class="cbIngAmount" *text="'x' .. self.firstIngAmount"></label>
                    </div>
                </div>

                <div class="cbIngSlot" *visible="self.secondIngVisible">
                    <UIItem class="cbIngIcon" *item-id="self.secondIngClientId" virtual="true"></UIItem>
                    <div class="cbIngInfo">
                        <label class="cbIngName">{{self.secondIngName}}</label>
                        <label class="cbIngAmount" *text="'x' .. self.secondIngAmount"></label>
                    </div>
                </div>

                <div class="cbIngSlot" *visible="self.thirdIngVisible">
                    <UIItem class="cbIngIcon" *item-id="self.thirdIngClientId" virtual="true"></UIItem>
                    <div class="cbIngInfo">
                        <label class="cbIngName">{{self.thirdIngName}}</label>
                        <label class="cbIngAmount" *text="'x' .. self.thirdIngAmount"></label>
                    </div>
                </div>

                <div class="cbIngSlot" *visible="self.fourthIngVisible">
                    <UIItem class="cbIngIcon" *item-id="self.fourthIngClientId" virtual="true"></UIItem>
                    <div class="cbIngInfo">
                        <label class="cbIngName">{{self.fourthIngName}}</label>
                        <label class="cbIngAmount" *text="'x' .. self.fourthIngAmount"></label>
                    </div>
                </div>

            </div>

            <div class="cbResultBox" title="Result">
                <UIItem class="cbResultIcon"
                    *visible="self.selectedResultClientId and self.selectedResultClientId > 0"
                    *item-id="self.selectedResultClientId or 1"
                    *border-color="self:getRarityColor(self.selectedResultRarity)"
                    virtual="true"></UIItem>
                <label class="cbResultName">{{self.selectedRecipeName}}</label>
                <label class="cbResultAmount"
                    *visible="self.selectedResultAmount > 0"
                    *text="'x' .. self.selectedResultAmount"></label>
            </div>

            <button class="cbCraftBtn" onclick="self:craftItem()">CRAFT</button>

        </div>

    </div>

    <hr style="height: 2px; width: 97%; margin-left:12px">

    <div class="cbFooter">
        <UIItem class="cbFooterResultIcon"
            *visible="self.selectedResultClientId and self.selectedResultClientId > 0"
            *item-id="self.selectedResultClientId or 1"
            virtual="true"></UIItem>
        <label class="cbFooterDescription">{{self.selectedResultDescription}}</label>
        <button class="cbCloseBtn" onclick="self:hide()" text="Sair"></button>
    </div>

</window>
</html>
